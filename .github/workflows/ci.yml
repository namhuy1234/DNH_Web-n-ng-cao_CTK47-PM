name: CI

on:
  push:
    branches: ["main", "huy-*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build CulinaryBlog.slnx -warnaserror
      - run: dotnet test CulinaryBlog.slnx --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  smoke:
    # Chạy thử như trên một máy mới tinh: Docker, API tự tạo database và dữ liệu mẫu, frontend,
    # rồi gọi các địa chỉ chính. Đạt nghĩa là clone về máy khác là chạy được.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash scripts/smoke-test.sh
