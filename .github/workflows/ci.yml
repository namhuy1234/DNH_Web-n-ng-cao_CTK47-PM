name: CI

on:
  push:
    branches: ["main", "huy-*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build CulinaryBlog.slnx

  smoke:
    # Chạy thử như trên một máy mới tinh: Docker, API tự tạo database và dữ liệu mẫu,
    # rồi gọi các địa chỉ chính. Đạt nghĩa là clone về máy khác là chạy được.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: bash scripts/smoke-test.sh
