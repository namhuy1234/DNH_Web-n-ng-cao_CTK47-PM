name: CI

on:
  push:
    branches: ["main", "huy-*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build CulinaryBlog.slnx -warnaserror
      - run: dotnet test CulinaryBlog.slnx --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:utils
      - run: npm run build

  tools:
    # Lab 8: các công cụ viết bằng ngôn ngữ khác phải ít nhất biên dịch/cú pháp đúng.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: node --check tools/load-test.mjs
      - run: python -m py_compile tools/log_report.py scripts/*.py
      - run: bash -n scripts/run-tests.sh
      - name: Kiểm tra cú pháp PowerShell
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/check-health.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  smoke:
    # Chạy thử như trên một máy mới tinh: Docker, API tự tạo database và dữ liệu mẫu, frontend,
    # rồi gọi các địa chỉ chính. Đạt nghĩa là clone về máy khác là chạy được.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash scripts/smoke-test.sh
