name: culinary-blog

services:
  postgres:
    image: postgres:16-alpine
    container_name: culinary-postgres
    environment:
      POSTGRES_DB: culinaryblog
      POSTGRES_USER: culinary
      # Mật khẩu chỉ dùng cho môi trường phát triển trên máy cá nhân
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-culinary_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U culinary -d culinaryblog"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Hộp thư giả cho môi trường phát triển: nhận email qua SMTP 1025, xem tại http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: culinary-mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
