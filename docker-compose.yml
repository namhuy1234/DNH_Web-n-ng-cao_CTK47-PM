name: culinary-blog

services:
  postgres:
    image: postgres:16-alpine
    container_name: culinary-postgres
    environment:
      POSTGRES_DB: culinaryblog
      POSTGRES_USER: culinary
      # Mật khẩu chỉ dùng cho môi trường phát triển trên máy cá nhân
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-culinary_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U culinary -d culinaryblog"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
